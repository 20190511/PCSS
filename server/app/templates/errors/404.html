<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found - PCSS</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; color: #333; }
        h1 { font-size: 50px; color: #c80150; margin-bottom: 20px; }
        p { font-size: 18px; color: #666; margin-bottom: 30px; }
        a { text-decoration: none; background-color: #34495e; color: white; padding: 10px 20px; border-radius: 5px; }
        a:hover { background-color: #2c3e50; }
    </style>
</head>
<body>
    <h1>404 Not Found</h1>
    <p>
        죄송합니다. 요청하신 페이지나 작업을 찾을 수 없습니다.<br>
        <span style="font-size: 14px; color: #999;">({{ error_message }})</span>
    </p>
    <a href="/">메인으로 돌아가기</a>
</body>
</html>
