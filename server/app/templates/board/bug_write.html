<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>버그 제보 - PCSS</title>
    <style>
      /* 기본 스타일은 공지 작성과 동일 */
      body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        padding: 20px;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #34495e;
        margin-top: 0;
      }
      label {
        font-weight: bold;
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
      }
      input[type="text"],
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
      }
      textarea {
        height: 200px;
        resize: vertical;
      }
      .btn-group {
        margin-top: 20px;
        text-align: right;
      }
      button {
        padding: 10px 20px;
        background: #34495e;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }
      button:hover {
        background: #2c3e50;
      }
      a.cancel {
        color: #666;
        text-decoration: none;
        margin-right: 15px;
      }
      /* 다크 모드 지원 (admin_page.html, bug_write.html 공용) */
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #181818;
          color: #e0e0e0;
        }
        .container {
          background-color: #242424;
          box-shadow: none;
          border: 1px solid #333;
        }
        h1 {
          /* notice_write는 원래 핑크, bug_write는 원래 다크블루지만 다크모드에선 통일 */
          color: #ff88a2;
        }
        label {
          color: #ccc;
        }
        input[type="text"],
        textarea {
          background-color: #333;
          border: 1px solid #555;
          color: #eee;
        }
        input::placeholder,
        textarea::placeholder {
          color: #888;
        }
        /* 버튼 스타일 */
        button {
          /* 원래 색상 대비 약간 밝거나 채도를 낮춤 */
          background-color: #b3305c; /* notice_write 원래색(c80150) 대응 */
        }
        /* bug_write.html의 버튼은 원래 파란색 계열이므로 다르게 처리 필요 시 아래 주석 해제 */
        /* body.bug-write-page button { background-color: #555; }
            body.bug-write-page button:hover { background-color: #666; }
            */

        button:hover {
          background-color: #d43f6f;
        }
        a.cancel {
          color: #aaa;
        }
        a.cancel:hover {
          color: #fff;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>
        {% if mode == 'edit' %}글 수정{% else %}버그 제보 / 건의{% endif %}
      </h1>
      <form method="post">
        <label>제목</label>
        <input
          type="text"
          name="title"
          required
          value="{{ bug.title if bug else '' }}"
        />

        <label>내용</label>
        <textarea name="content" required>
{{ bug.content if bug else '' }}</textarea
        >

        <div class="btn-group">
          <a href="/board" class="cancel">취소</a>
          <button type="submit">
            {% if mode == 'edit' %}수정 완료{% else %}등록{% endif %}
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
